[workspace]
members = [
    "crates/nexum-cli",
    "crates/nexum-launch",
    "crates/nexum-module-macros",
    "crates/nexum-primitives",
    "crates/nexum-runtime",
    "crates/nexum-runtime-api",
    "crates/nexum-runtime-chain",
    "crates/nexum-runtime-config",
    "crates/nexum-runtime-http",
    "crates/nexum-runtime-logs",
    "crates/nexum-runtime-manifest",
    "crates/nexum-runtime-metrics",
    "crates/nexum-runtime-store",
    "crates/nexum-runtime-supervisor",
    "crates/nexum-runtime-testing",
    "crates/nexum-runtime-wasm",
    "crates/nexum-sdk",
    "crates/nexum-sdk-test",
    "crates/nexum-tasks",
    "crates/nexum-world",
    "modules/example",
    "modules/examples/balance-tracker",
    "modules/examples/http-probe",
    "modules/examples/price-alert",
    "modules/fixtures/clock-reader",
    "modules/fixtures/env-reader",
    "modules/fixtures/flaky-bomb",
    "modules/fixtures/fuel-bomb",
    "modules/fixtures/log-bomb",
    "modules/fixtures/memory-bomb",
    "modules/fixtures/panic-bomb",
    "modules/fixtures/slow-host",
    "modules/fixtures/topic-parity",
]
# A virtual manifest has no edition, so an absent key means resolver 1.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.94.0"
repository = "https://github.com/nullislabs/nexum-runtime"

# Shared dependency table. Every external dependency is hoisted here.
# Core workspace crates (the engine, SDK, tooling) inherit with
# `dep.workspace = true` and may add features per call site via
# `dep = { workspace = true, features = ["extra"] }`. Standalone guest
# modules under `modules/` do NOT inherit external deps from here: a
# real module author has no access to this table, so they express-declare
# their own external deps and inherit only local crates via `path`.
# Version drift across the core crates is impossible by construction.
[workspace.dependencies]
# Error + async plumbing.
anyhow = "1"
thiserror = "2"
# Featureless on purpose: each consuming crate enables its own surface.
tokio = { version = "1" }
futures = "0.3"

# Serde + config.
serde = { version = "1", features = ["derive"] }
# Interface-id versions; already in the graph via wasmtime's wit-parser.
semver = "1"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Borsh wire codec behind the venue SDK's versioned `IntentBody` bodies.
# The venue SDK re-exports the runtime crate for its derive's generated
# code; `derive` is on so venue payload types can `#[derive(BorshSerialize,
# BorshDeserialize)]` through the same dependency.
borsh = { version = "1", features = ["derive"] }

# Non-async locks. A guard is `!Send`, so holding one across an await fails
# to compile rather than blocking the executor.
parking_lot = "0.12"

# Observability.
tracing = "0.1"
# `tracing-core` alone (no subscriber registry) backs the guest-side
# tracing facade in `nexum-sdk`: a wasm module links only the event
# dispatch, not the host-oriented fmt/registry machinery.
tracing-core = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "json"] }

# `strum::IntoStaticStr` on error / event enums gives a free
# snake_case `&'static str` for every variant, which feeds directly
# into `metrics::counter!(..., "error_kind" => name)` and
# `tracing::warn!(error_kind = name, ...)` recordings without an
# ad-hoc `match err { ... => "connect" ... }` ladder per call site.
strum = { version = "0.28", default-features = false, features = ["derive"] }

# `auto_impl::auto_impl(&, Arc, Box)` forwarding impls for traits
# held through smart pointers. Available workspace-wide so any future
# `Arc<dyn Trait>` boundary can opt in without touching root manifest.
auto_impl = "1"

# `derive_more` newtype boilerplate (`Deref`, `From`, `Display`, ...).
# `default-features = false, features = ["full"]` keeps the proc-macro
# surface predictable; per-derive opt-in via the standard `#[derive(...)]`
# syntax. Available workspace-wide; not pulled in by default.
derive_more = { version = "2", default-features = false, features = ["full"] }

# CLI parser. Used by every binary crate (engine) via the derive macro.
clap = { version = "4", features = ["derive"] }

# alloy stack. Engine uses the full provider/transport surface;
# guest-facing crates use `alloy-primitives` + `alloy-sol-types` for
# typed protocol values. Pinned together so a single workspace bump
# moves every consumer at once.
alloy-primitives = { version = "1.6", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.6", default-features = false, features = ["std"] }
# Featureless here so the guest SDK's wasm build stays transport-free;
# the engine and tooling add ws/ipc/pubsub/reqwest at their call sites.
alloy-provider = { version = "2.1", default-features = false }
alloy-rpc-types-eth = { version = "2.1", default-features = false, features = ["std"] }
alloy-transport-ws = { version = "2.1", default-features = false }
# Typed EIP-155 chain ids for config keys, provider pools, and the
# chain seam. Already in the graph via alloy-provider; named here so
# the engine can key maps and signatures on `Chain` instead of a bare u64.
alloy-chains = { version = "0.2", default-features = false, features = ["std", "serde"] }

# HTTP transport for the SDK helpers and test surfaces.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Typed HTTP method/request/response for the engine's wasi:http gate.
# Single `http` version in the graph via reqwest, so `reqwest::Method`
# is `http::Method`.
http = "1"
# Body trait + combinators (already in the graph via wasmtime-wasi-http)
# for the engine's response-body cap on the wasi:http gate.
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# Proc-macro toolkit backing `nexum-module-macros`. Host-side only: a
# proc-macro crate always builds for the host, even when the module
# consuming it targets wasm.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# `wit-bindgen` is consumed by every guest module crate (example +
# every fixture). Hoisted so a single bump moves them in lock-step.
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

# Guest-side wasi:http client behind the SDK's `http::fetch` helper.
# Binds wasi 0.2.x through the `wasip2` crate, matching the wasi:http
# WIT the engine's wasmtime hosts. `default-features = false` drops
# the serde-json body helpers the SDK does not expose.
# Licence: Apache-2.0 WITH LLVM-exception.
wstd = { version = "0.6", default-features = false }

# WASM Component Model runtime (engine host).
wasmtime = { version = "46", features = ["component-model"] }
wasmtime-wasi = "46"
# Host implementation of wasi:http; default features keep the hyper +
# rustls outgoing backend (`default-send-request`) the engine fronts
# with its per-module allowlist gate.
wasmtime-wasi-http = "46"
# Pinned to the exact wit-parser version wasmtime v46.0.1 embeds, so the
# WIT cross-check test parses with the same parser the runtime does.
wit-parser = "=0.251.0"

# Manifest parsing.
toml = "1"

# CIDR blocks for the `[policy].http_deny` egress denylist. Already in
# the graph via the hyper stack.
ipnet = "2"

# Metrics facade + Prometheus exporter (engine `/metrics` listener).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
# Recording recorder for the test harness: a scoped recorder lets a test
# assert that a counter fired with the labels it claims, so a "counted"
# done-condition is checkable rather than satisfied by an unreachable call.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

# alloy JSON-RPC client + transport (engine chain backend and the
# guest SDK's host-backed transport).
alloy-json-rpc = { version = "2.1", default-features = false }
alloy-rpc-client = { version = "2.1", default-features = false }
alloy-transport = { version = "2.1", default-features = false }

# Embedded key-value store (engine local-store backend).
redb = "4"

# Misc engine host deps.
url = "2"

# HTTP server for test tooling.
axum = "0.8"

# Randomness for tooling.
rand = "0.10"

# Hex codec for test fixtures and receipt rendering.
hex = "0.4"

# Must resolve with what `alloy-primitives` re-exports, or `const_hex::FromHexError` becomes two types.
const-hex = { version = "1.19", default-features = false, features = ["alloc", "core-error"] }

# Content digests for loaded component bytes.
sha2 = "0.10"

# Dev/test helpers.
tempfile = "3"
wiremock = "0.6"
proptest = "1"
tower = "0.5"
# Compile-fail harness pinning proc-macro rejection diagnostics.
trybuild = "1"

# Workspace-standard lint set. New crates inherit via
# `[lints] workspace = true` in their package manifest. `unsafe_code`
# cannot be denied workspace-wide because every wit-bindgen guest
# module emits an `unsafe extern "C"` shim; modules carrying that
# macro keep the default-warn allowance, and unsafe in non-binding
# code still trips review by convention.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# Every public item states what the signature does not. `-D warnings` in
# CI makes this fatal, so an undocumented addition to a public surface
# fails the build rather than accruing.
missing_docs = "warn"

[workspace.lints.clippy]
# Deny the easy footguns. Each crate carries its own narrower
# `#![deny(...)]` where the cost of a violation is high (e.g. the
# binary entrypoints carry `unused_crate_dependencies` warn).
dbg_macro = "deny"
todo = "deny"
# A panic in the host kills every module it supervises, so a fallible
# call in production code states its recovery. Tests are exempt through
# `allow-unwrap-in-tests` / `allow-expect-in-tests` in `clippy.toml`;
# a production site that genuinely cannot fail carries an `#[expect]`
# with the invariant that makes it so.
unwrap_used = "deny"
expect_used = "warn"

# Cargo forces unwind on test and bench regardless, so `#[should_panic]` works.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
