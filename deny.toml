# Supply-chain gate over the resolved dependency graph: advisories, licences,
# duplicate versions and package sources. Run it with `just deny`.

[graph]
# Match the feature set every other gate compiles under, so a dependency that
# only appears behind a feature is still checked.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# An unmaintained crate is a maintenance signal, not a vulnerability, and only
# a dependency the workspace declares itself can be acted on here.
unmaintained = "workspace"

[licenses]
# Deny by default: a licence not named here fails the gate. Derived from the
# resolved graph, not from what would be tolerable.
allow = [
    "0BSD",
    # The workspace itself.
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Also the arm that admits ittapi and ittapi-sys, whose expression is
    # `GPL-2.0-only OR BSD-3-Clause`. GPL-2.0-only is absent by intent: it
    # cannot combine with an AGPL-3.0 work, so an OR that loses its BSD arm
    # fails here rather than being admitted.
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Dozens of crates already resolve at more than one version. Tighten to "deny"
# once that reaches zero.
multiple-versions = "warn"
# Every wildcard in this graph is a version-less path dependency between
# workspace members. `allow-wildcard-paths` exempts only crates marked
# `publish = false`, which these are not, so it cannot separate the two here.
wildcards = "allow"

[sources]
# Cargo.lock carries no git sources, so this is strict from the start.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
