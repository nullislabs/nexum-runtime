[package]
name = "nexum-runtime-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The metric registry for the Nexum runtime: every emitted name, its kind, and its HELP text."

[lints]
workspace = true

[features]
# The capture harness, beside the table it captures. A crate that asserts on
# an emitted metric takes this rather than the composed mocks, which reach the
# whole engine.
testing = ["dep:metrics-util", "dep:tokio"]

[dependencies]
metrics.workspace = true
metrics-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
