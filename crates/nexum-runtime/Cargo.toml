[package]
name = "nexum-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# WASM Component Model runtime. wasi:http is serviced by
# wasmtime-wasi-http's hyper + rustls backend behind the per-module
# allowlist gate in `host::http`.
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true

# Async + error plumbing.
anyhow.workspace = true
thiserror.workspace = true
# `strum::IntoStaticStr`: the snake_case variant name is the tracing
# `channel` field (`LogChannel`) and the boot-refusal `error_kind` label.
strum.workspace = true
# Full-semver interface ids and their compatibility tracks.
semver.workspace = true
# No `rt`: spawning belongs to `nexum-tasks`. Omitting it enforces nothing,
# since `nexum-tasks` unifies `rt` back in; the `clippy.toml` ban does.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
# Task lifecycle and graceful shutdown; the sole crate that raw-spawns
# tokio tasks. Every engine task routes through its executor.
nexum-tasks = { path = "../nexum-tasks" }
# Single-source capability and fault-label vocabularies; the registry's
# core interface set is emitted from its table.
nexum-world = { path = "../nexum-world" }
nexum-primitives = { path = "../nexum-primitives", features = ["metrics"] }
nexum-runtime-config = { path = "../nexum-runtime-config" }
nexum-runtime-manifest = { path = "../nexum-runtime-manifest" }

toml.workspace = true
ipnet.workspace = true
serde_json = { workspace = true, features = ["std"] }

# Observability. `tracing` replaces the prior `eprintln!` debug log
# so the engine can drop into a structured log pipeline in production.
tracing.workspace = true
# `tracing_core::Level` is the level vocabulary carried on log records;
# the two WIT edges are the only place a generated severity enum appears.
tracing-core.workspace = true

# Prometheus exporter. `metrics` is the facade every
# recording site (dispatch, host backends) calls; the exporter
# crate installs the recorder + binds the `/metrics` HTTP listener.
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Typed HTTP request/URI values for the wasi:http allowlist gate, plus
# the body trait + combinators the gate's response-body cap wraps
# incoming bodies with.
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true

# `chain` backend. Each configured chain owns a `DynProvider` built
# from a `WsConnect`/`Http` transport so the host's `request` impl can
# hand a raw `(method, params)` pair to alloy's JSON-RPC layer without
# reimplementing the codec.
alloy-provider = { workspace = true, features = ["ws", "ipc", "pubsub", "reqwest"] }
alloy-rpc-client.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-transport.workspace = true
alloy-transport-ws.workspace = true
alloy-primitives.workspace = true
# Typed EIP-155 chain ids for engine config keys, the provider/orderbook
# pools, and the chain seam.
alloy-chains.workspace = true
# HTTP transport client carrying the per-chain request timeout.
reqwest.workspace = true
futures.workspace = true

# `local-store` backend. Per-module namespacing is enforced
# host-side via a `[len:u8][module_name][raw_key]` prefix.
redb.workspace = true

# Misc.
url.workspace = true

# Enabled by `test-utils`: the `TestRuntime` harness temp-files inline
# manifests before boot, and the in-process mock RPC transports implement
# the tower service seam over alloy's JSON-RPC packet types.
derive_more = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
alloy-json-rpc = { workspace = true, optional = true }
metrics-util = { workspace = true, optional = true }

[features]
# Test-only helpers under `test_utils`: the in-process mock RPC transports
# (scripted and routed) behind the real `ProviderPool`, the `MockStateStore`
# and `MockTypes` lattice, the manually-driven `ManualClock`, and the
# `TestRuntime` harness. Off by default; a downstream test crate opts in.
# The self dev-dependency below turns it on for this crate's own tests.
test-utils = [
    "dep:derive_more",
    "dep:serde",
    "dep:tempfile",
    "dep:tower",
    "dep:alloy-json-rpc",
    "dep:metrics-util",
]

[dev-dependencies]
# Self dev-dependency enabling `test-utils` for this crate's own test, doc,
# and example targets, so `cargo test -p nexum-runtime` sees the mocks
# without every invocation passing `--features test-utils`.
nexum-runtime = { path = ".", features = ["test-utils"] }
# `start_paused` reconnect tests advance the backoff clock virtually.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true
wiremock.workspace = true
tracing-subscriber.workspace = true
