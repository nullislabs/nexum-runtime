[package]
name = "nexum-module-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro glue for nexum runtime modules: #[module] emits the per-cdylib wit-bindgen, host adapter, event dispatch, and export."

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# Typed `B256` topics from the manifest extraction, embedded into the
# emitted parity check.
alloy-primitives.workspace = true
nexum-world = { path = "../nexum-world", features = ["macros"] }
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile.workspace = true
# Pins the rendered rustc diagnostics for the rejected `#[module]`
# inputs under tests/ui/.
trybuild.workspace = true
