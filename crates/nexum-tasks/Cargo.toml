[package]
name = "nexum-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Task lifecycle and graceful shutdown for the Nexum runtime"

[lints]
workspace = true

[dependencies]
# The only crate that raw-spawns: `rt` for `Handle`/`JoinHandle`/
# `spawn_blocking`, `sync` for the watch shutdown signal and the mpsc
# drain, `time` plus `macros` for the bounded-drain `select!` deadline.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
futures.workspace = true
tracing.workspace = true
