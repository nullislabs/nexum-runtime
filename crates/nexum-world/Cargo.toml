[package]
name = "nexum-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-module WIT world synthesis: the core capability table, registry-driven extension rows, manifest parsing, and crate-local WIT package resolution."

[lints]
workspace = true

[features]
# The syn-typed helper (`is_plain_type`), for the proc-macro crates only:
# non-macro consumers take nexum-world without `syn`.
macros = ["dep:syn"]

[dependencies]
# Typed `B256` topics for the chain-log extraction, so the macro-side
# parity check parses the same values the runtime loads.
alloy-primitives.workspace = true
# Derives the closed capability / fault-label vocabularies: `VariantNames`
# supersedes a hand-maintained list, `EnumString` parses fail-closed.
strum.workspace = true
syn = { workspace = true, optional = true }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Cross-checks `CORE` against `wit/nexum-host/`. Pinned to the exact
# version wasmtime v46.0.1 embeds, so the test parses the WIT with the
# same parser the runtime does. Not hoisted: the pin is local to this
# test and must move in lockstep with the wasmtime major, not with the
# workspace.
wit-parser = "=0.251.0"
