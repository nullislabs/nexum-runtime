# flaky-bomb test fixture. Subscribes to blocks; `on_event`
# traps via `unreachable!()` on the first N attempts, then recovers.
# Drives the supervisor's exponential-backoff restart policy through
# its full lifecycle.

[component]
name = "flaky-bomb"
version = "0.1.0"

[dependencies]
logging = {}
local-store = {}

[[subscription]]
kind = "block"
chain_id = 1

[config]
# Number of consecutive events to trap on before recovering. Tests
# typically synthesise a manifest with `fail_first_n = "1"` to keep
# the test wall-clock short (only one 1 s backoff window to wait).
fail_first_n = "1"
