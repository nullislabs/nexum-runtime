[package]
name = "log-bomb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Evil-by-design fixture: on_trigger floods the host logging verb with records far over the per-record byte cap and far past the log rate. Proves the host truncates the oversized record, drops the overflow fields, and drops the over-rate records, all inside one dispatch deadline."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }
