# env-reader test fixture. Declares a block trigger on a single chain so the
# supervisor invokes `on_trigger` once per block; the handler counts the
# environment variables and process arguments std can see and logs both.
# The integration test boots this fixture from a host process whose own
# environment and argv are non-empty and asserts the guest observed zero
# of each, proving the store discloses neither.

[component]
name = "env-reader"
version = "0.1.0"

[dependencies]
logging = {}

[[trigger]]
on = "block"
chain_id = 1
