# slow-host test fixture. Declares a block trigger on a single chain so the
# supervisor invokes `on_trigger` once per block; the handler issues one
# `chain::request` host call and returns Ok. The integration test wires
# the chain capability to a mock provider that parks the first request
# far past a short `[limits.dispatch].deadline_secs` override, so the
# dispatch deadline fires while the guest is suspended inside the host
# call. This proves the supervisor cuts off a blocked host call, marks
# the module dead, and reinstantiates it on a fresh store, which fuel
# and epoch metering cannot do because neither sees time spent in
# native host code.

[component]
name = "slow-host"
version = "0.1.0"

[dependencies]
logging = {}
chain = {}

[[trigger]]
on = "block"
chain_id = 1
