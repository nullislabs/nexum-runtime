# clock-reader test fixture. Declares a block trigger on a single chain so
# the supervisor invokes `on_trigger` once per block; the handler reads the WASI
# wall clock through std and logs it. The integration test boots this
# fixture under a pinned clock override and asserts the logged time matches
# the override, proving the guest observes virtualized time end to end.

[component]
name = "clock-reader"
version = "0.1.0"

[dependencies]
logging = {}

[[trigger]]
on = "block"
chain_id = 1
