# panic-bomb test fixture. Declares a block trigger; `init` installs the
# nexum-sdk tracing facade (subscriber + panic hook) and `on_trigger`
# panics. The hook writes the panic to stderr and forwards it over the
# host logging call before the trap reaches the supervisor, so the
# integration test asserts one dead run carries Stderr, HostInterface,
# and Panic records.

[component]
name = "panic-bomb"
version = "0.1.0"

[dependencies]
logging = {}

[[trigger]]
on = "block"
chain_id = 1
