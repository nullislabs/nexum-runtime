# `on_event` handler allocates 128 MiB which exceeds the default 64
# MiB per-module cap. The host traps + the integration test asserts
# the supervisor marks the module dead.

[component]
name = "memory-bomb"
version = "0.1.0"

[dependencies]
logging = {}

[[subscription]]
kind = "block"
chain_id = 1
