# fuel-bomb test fixture. Declares a block trigger on a single chain
# so the supervisor invokes `on_trigger` once; the unbounded
# loop in `on_trigger` then exhausts the wasmtime fuel budget and the
# host traps `OutOfFuel`. The integration test asserts the trap is
# caught + the module is marked dead.

[component]
name = "fuel-bomb"
version = "0.1.0"

[dependencies]
logging = {}

[[trigger]]
on = "block"
chain_id = 1
