# http-probe example module: on every matching block it fetches an
# allowlisted URL over wasi:http and logs the status, then fetches an
# off-list URL and verifies the host denies it before any connection.
# Demonstrates `nexum_sdk::http::fetch` plus the http dependency hosts.

[component]
name = "http-probe"
version = "0.1.0"

[dependencies]
logging = {}
# Hosts this component may reach. Any other host is denied
# before a connection is made.
http = { hosts = ["api.cow.fi"] }

[[trigger]]
on = "block"
chain_id = 11155111

# --- config -----------------------------------------------------------

[config]
# URL fetched on every matching block; its host must be allowlisted.
probe_url = "https://api.cow.fi/mainnet/api/v1/version"
# URL whose host is deliberately off-list. The module expects the
# denied error and treats any other outcome as a failure.
denied_url = "https://example.com/"
# Throttle: only probe every Nth block. Default 1, and a zero refuses at init.
every_n_blocks = "1"
