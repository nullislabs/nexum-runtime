name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # -D warnings on every compile (deps + workspace). Keep byte-identical across all
  # jobs: any per-job RUSTFLAGS delta re-fingerprints the whole graph and every
  # sccache object key, defeating reuse.
  RUSTFLAGS: "-D warnings"
  # sccache caches individual rustc invocations across jobs and runs, including the
  # workspace crates (which Swatinem drops). Requires incremental off. Backed by the
  # GitHub Actions cache (SCCACHE_GHA_ENABLED): free, no secrets, and available on
  # fork pull_request runs, so forks build cached too. The per-repo cache evicts LRU
  # on its own; a miss degrades to a cold compile, never a build failure.
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the commit range in a pull request resolves; the
      # default shallow clone has no merge base to walk back to.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # No toolchain: this job reads text, so it must not wait on rust-setup.
      # The pull-request body arrives through the environment and never through
      # the command line, so its content cannot be read as shell.
      - name: House style
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=""
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          ./scripts/content-lint.sh "$range"
      # Reads text and compiles nothing, so it belongs in this toolchain-free
      # job.
      - name: Zero leak
        run: ./scripts/zero-leak.sh
      - name: MSRV
        run: ./scripts/msrv-lint.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check # parse-only; never compiles

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      # clippy runs in its own job and target dir: no build/doc step precedes it, so
      # -D warnings is re-evaluated on clippy's own fingerprints and can never be
      # served from an rmeta a warning-tolerant build primed. (This is why the native
      # jobs stay parallel rather than merged into one warm-target-dir job.)
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # mold is symlinked as `ld` by setup-mold, NOT put in RUSTFLAGS: it keeps
      # linking fast (which sccache cannot cache anyway) without a linker flag in the
      # cache key. wasm targets link with rust-lld, untouched.
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest
      # Build all 13 guest wasms ONCE (release/wasm32-wasip2): the single source of
      # truth for guest buildability and the artifacts the integration tests load.
      # Per-module size report folded in; a compile break still names the offending
      # crate and -D warnings still applies.
      - name: build module wasms (+ size report)
        run: |
          cargo build --release --target wasm32-wasip2 --locked \
            -p example -p price-alert -p balance-tracker -p http-probe \
            -p clock-reader -p env-reader -p flaky-bomb -p fuel-bomb \
            -p log-bomb -p memory-bomb -p panic-bomb -p slow-host -p topic-parity
          {
            echo "### module .wasm sizes"
            echo "| module | bytes |"
            echo "|---|---:|"
            for f in target/wasm32-wasip2/release/*.wasm; do
              printf '| %s | %s |\n' "$(basename "$f" .wasm)" "$(wc -c < "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # The integration tests load the wasms from their exact
      # target/wasm32-wasip2/release/*.wasm paths built above; keep --release and the
      # path and --all-features on both nextest and the doctests.
      - run: cargo nextest run --workspace --all-features --no-fail-fast --locked
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --doc --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # RUSTDOCFLAGS affects only the rustdoc pass (not the sccache-keyed rustc), so
      # it may differ from RUSTFLAGS without splitting the compile cache.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/rust-setup
      # Without --all-features rustdoc skips `test_utils`, and a broken intra-doc link there lands green.
      - run: cargo doc --workspace --all-features --no-deps --locked
